name: Lorekeeper Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $destination = Join-Path $env:APPDATA "XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $destination -Force

      - name: Restore
        run: dotnet restore Lorekeeper.sln --locked-mode

      - name: Build Release
        run: dotnet build Lorekeeper.sln --configuration Release --no-restore

      - name: Store package
        uses: actions/upload-artifact@v4
        with:
          name: Lorekeeper-build
          path: Lorekeeper/bin/x64/Release/Lorekeeper/*
          if-no-files-found: error
          retention-days: 7
