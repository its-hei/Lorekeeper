<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    />

        <title>Lorekeeper OBS Overlay</title>

        <style>
            * {
            box-sizing: border-box;
            }

            html,
            body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            }

            body {
            font-family: Arial, Helvetica, sans-serif;
            }

            #dialogue {
            position: fixed;
            left: 50%;
            bottom: 200px;

            width: min(700px, calc(100vw - 80px));
            padding: 10px 14px 12px;

            border-left: 2px solid rgba(255, 154, 60, 0.90);
            border-radius: 7px;

            background: rgba(8, 10, 15, 0.52);
            box-shadow:
            0 6px 18px rgba(0, 0, 0, 0.24),
            inset 0 0 0 1px rgba(255, 255, 255, 0.07);

            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 8px);

            transition:
            opacity 150ms ease,
            transform 150ms ease,
            visibility 150ms;
            }

            #dialogue.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
            }

            #npc-name {
            margin-bottom: 3px;

            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;

            color: #ff9a3c;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
            }

            #translation {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.28;

            color: rgba(255, 255, 255, 0.97);
            text-shadow:
            0 1px 4px rgba(0, 0, 0, 0.90),
            0 0 1px rgba(0, 0, 0, 1);

            white-space: pre-wrap;
            overflow-wrap: anywhere;
            }
        </style>
    </head>

    <body>
        <main id="dialogue" aria-live="polite">
            <div id="npc-name"></div>
            <div id="translation"></div>
        </main>

        <script type="text/javascript">
            //<![CDATA[
        const dialogueElement =
            document.getElementById("dialogue");

        const npcNameElement =
            document.getElementById("npc-name");

        const translationElement =
            document.getElementById("translation");

        let lastSnapshotKey = "";

        function hideDialogue() {
            dialogueElement.classList.remove("visible");
        }

        function renderSnapshot(snapshot) {
            const npcName =
                String(snapshot?.NpcName ?? "").trim();

            const translation =
                String(snapshot?.Translation ?? "").trim();

            const isOpen =
                snapshot?.IsOpen === true;

            const snapshotKey =
                `${npcName}\u0000${translation}\u0000${isOpen}`;

            if (snapshotKey !== lastSnapshotKey) {
                npcNameElement.textContent = npcName;
                translationElement.textContent = translation;
                lastSnapshotKey = snapshotKey;
            }

            const shouldBeVisible =
                isOpen && translation.length > 0;

            dialogueElement.classList.toggle(
                "visible",
                shouldBeVisible);
        }

        async function updateDialogue() {
            try {
                const response = await fetch(
                    `/api/dialogue?t=${Date.now()}`,
                    {
                        method: "GET",
                        cache: "no-store"
                    });

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`);
                }

                const snapshot = await response.json();
                renderSnapshot(snapshot);
            } catch {
                hideDialogue();
            } finally {
                window.setTimeout(updateDialogue, 100);
            }
        }

        updateDialogue();
//]]>
        </script>
    </body>
</html>
